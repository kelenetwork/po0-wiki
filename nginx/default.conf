server {
  listen 80;
  sub_filter_once on;
  sub_filter_types text/html;

  # Eagerly fetch /api/public/probes/snapshot before any JS chunk parses,
  # so by hydration time the data is already in flight. The hook reads
  # window.__po0SnapshotPromise; if absent it falls back to a fresh fetch.
  sub_filter '<head>' '<head><script>(function(){try{window.__po0SnapshotPromise=fetch("/api/public/probes/snapshot",{headers:{Accept:"application/json"}}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});}catch(e){}})();</script>';

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    text/css
    text/plain
    text/javascript
    text/xml
    image/svg+xml;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;


  rewrite ^/admin/$ /admin.html last;

  location = /llms.txt {
    types {}
    default_type 'text/plain; charset=utf-8';
    try_files /llms.txt =404;
  }

  location = /llms-full.txt {
    types {}
    default_type 'text/plain; charset=utf-8';
    try_files /llms-full.txt =404;
  }

  location = /robots.txt {
    types {}
    default_type 'text/plain; charset=utf-8';
    try_files /robots.txt =404;
  }

  location ^~ /admin/ {
    try_files $uri $uri.html $uri/index.html /admin.html;
  }

  location / {
    # Same no-cache policy as bare *.html so SPA-style routes (e.g. /, /status,
    # /looking-glass without explicit .html extension) also revalidate every
    # navigation. Hashed assets below get their own immutable headers via the
    # extension-specific location.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri.html $uri/index.html $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://probe-hub:3331;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    add_header X-Accel-Buffering no always;
  }

  # HTML must never be cached aggressively: it references hashed JS/CSS chunks
  # and a stale HTML would point browsers at long-gone chunk filenames, breaking
  # the page indefinitely until users manually hard-refresh.
  location ~* \.html?$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Long-cache only for hashed asset filenames like /static/js/main.a3f9c1.js.
  # Unhashed files (favicon.ico, logo.svg, og:image, robots.txt asset etc.)
  # might be replaced in-place during a deploy, so we want a short max-age
  # and a revalidation each time. Otherwise CF will pin an old file at the
  # edge for 30d.
  location ~* "\.[a-f0-9]{6,32}\.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$" {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri =404;
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
